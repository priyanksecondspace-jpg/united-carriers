(function(){
  // The homepage scene relies on scripts that only start on a full page load,
  // so client-side transitions into "/" are turned into a real navigation.
  function isHome(u){ try{ var p=new URL(u,location.href).pathname; return p==='/'||p==='/index.html'; }catch(e){ return false; } }
  var here=location.pathname;
  ['pushState','replaceState'].forEach(function(k){
    var orig=history[k];
    history[k]=function(s,t,u){
      if(u!=null && isHome(u) && !isHome(here)){ location.href=new URL(u,location.href).href; return; }
      var r=orig.apply(this,arguments); here=location.pathname; return r;
    };
  });
  window.addEventListener('popstate',function(){ if(isHome(location.href) && !isHome(here)) location.reload(); here=location.pathname; });
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href]'); if(!a||a.target==='_blank') return;
    if(isHome(a.getAttribute('href')) && !isHome(location.href)){ e.preventDefault(); e.stopImmediatePropagation(); location.href='/'; }
  },true);
})();
</script><style id="rr-no-badge">.awwwards-badge,.awwwards-badge-link,[class*="awwwards"],a[href*="awwwards.com"]{display:none!important}</style></head>
